MODEL_KEY: "COMMON"
MODEL_NAME: "公共"
version: "1.0.0"

# 系统配置信息：启动时增量读取并保存到 common_setting 表
# 配置层级: SETTING.${field_type}.${field_key}: ${field_default_value}
# 依据: artificial/docs/设计文档/common/common_setting.md
# 说明: database / redis 段的默认值经 application.properties 的 spring.config.import 引用，
#       作为 Spring 启动连接参数（数据源、Redis）的默认值；各模块读取与维护经 CommonSettingService。
SETTING:
  database:
    db_type: mysql
    db_host: localhost
    db_port: 3306
    db_name: common
    db_login_name: root
    db_password: root
    db_driver: com.mysql.cj.jdbc.Driver
  redis:
    redis_host: localhost
    redis_port: 6379
    redis_password: ""
    redis_database: 0
    redis_timeout: 5s
  system:
    login_unusing_time: 3600
    login_lock_time: 5
    login_locking_time: 300
    login_open_lock: true
    login_email_enable: false
    login_phone_enable: false
    pwd_change_cycle: 0
    pwd_repeat_limit: 3
