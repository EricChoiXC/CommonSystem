ROLE_LIST: ["SYS_ORG_ADMIN", "SYS_ORG_ELEMENT_ADMIN", "SYS_ORG_ELEMENT_ADD", "SYS_ORG_ELEMENT_EDIT", "SYS_ORG_ELEMENT_EXPORT", "SYS_ORG_ELEMENT_IMPORT", "SYS_ORG_ROLE_ADMIN", "SYS_ORG_USER_MANAGER", "SYS_ORG_GROUP_ADMIN"]
