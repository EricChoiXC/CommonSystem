# =====================================================================
# 日志模块系统码值配置：启动时增量导入（field_system = true）
# 码值来源代码：enums/SysLogType、enums/SysLogAction、enums/SysLogResult
# =====================================================================
dict:
  log_type:
    name: 日志类型
    desc: sys_log_operation.field_log_type
    1: 操作日志
    2: 登录日志
  log_action:
    name: 操作动作
    desc: sys_log_operation.field_action（动作取值全系统唯一，业务模块扩展动作时在此补充）
    save: 保存/新增
    update: 更新
    delete: 删除
    submit: 提交
    import: 导入
    export: 导出
    download: 下载
    changePwd: 修改密码
    login: 登录
    logout: 登出
    forbidden: 鉴权拒绝
  log_result:
    name: 日志结果
    desc: sys_log_operation.field_result
    SUCCESS: 成功
    FAILED: 失败
