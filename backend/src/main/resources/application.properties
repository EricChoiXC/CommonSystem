application.name=CommonSystem

# \u5F15\u5165\u516C\u5171\u914D\u7F6E\uFF1Aproperties/common/application.yml \u7684 SETTING \u6BB5\uFF08database/redis/system \u9ED8\u8BA4\u503C\uFF09
# \u4F9B\u4E0B\u65B9\u6570\u636E\u6E90\u4E0E Redis \u8FDE\u63A5\u53C2\u6570\u5360\u4F4D\u7B26\u5F15\u7528\uFF0C\u5B9E\u73B0\u914D\u7F6E\u9ED8\u8BA4\u503C\u5355\u4E00\u6765\u6E90\uFF1B\u73AF\u5883\u53D8\u91CF\uFF08CS_*\uFF09\u4ECD\u4F18\u5148\u3002
# \u6CE8\u610F\uFF1Aimport \u540E\u952E\u4FDD\u7559 SETTING. \u524D\u7F00\uFF08\u5982 SETTING.database.db_host\uFF09\uFF0C\u5360\u4F4D\u7B26\u987B\u5B8C\u6574\u5F15\u7528\u3002
spring.config.import=classpath:properties/common/application.yml

spring.application.name=CommonSystem
spring.datasource.driver-class-name=${SETTING.database.db_driver:com.mysql.cj.jdbc.Driver}
spring.datasource.url=jdbc:mysql://${CS_DB_HOST:${SETTING.database.db_host:localhost}}:${CS_DB_PORT:${SETTING.database.db_port:3306}}/${CS_DB_NAME:${SETTING.database.db_name:common}}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${CS_DB_USER:${SETTING.database.db_login_name:root}}
spring.datasource.password=${CS_DB_PASSWORD:${SETTING.database.db_password:root}}

mybatis.mapper-locations=classpath:mappers/**/*Mapper.xml
mybatis.type-aliases-package=com.common.system
mybatis.configuration.map-underscore-to-camel-case=true

# Flyway \u6570\u636E\u5E93\u8FC1\u79FB
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis \u7F13\u5B58\uFF08\u8FDE\u63A5\u53C2\u6570\u9ED8\u8BA4\u503C\u5F15\u7528 SETTING.redis.*\uFF0C\u53EF\u7528 CS_REDIS_* \u73AF\u5883\u53D8\u91CF\u8986\u76D6\uFF09
spring.data.redis.host=${CS_REDIS_HOST:${SETTING.redis.redis_host:localhost}}
spring.data.redis.port=${CS_REDIS_PORT:${SETTING.redis.redis_port:6379}}
spring.data.redis.password=${CS_REDIS_PASSWORD:${SETTING.redis.redis_password:}}
spring.data.redis.database=${CS_REDIS_DATABASE:${SETTING.redis.redis_database:0}}
spring.data.redis.timeout=${CS_REDIS_TIMEOUT:${SETTING.redis.redis_timeout:5s}}

# \u9644\u4EF6\u6A21\u5757\uFF1A\u6587\u4EF6\u5B58\u50A8\u6839\u76EE\u5F55\uFF08\u76F8\u5BF9\u8DEF\u5F84\u76F8\u5BF9\u4E8E\u5E94\u7528\u8FD0\u884C\u76EE\u5F55\uFF1B\u6A21\u5757\u4E13\u6709\u914D\u7F6E\uFF0C\u89C1 sys/att/application.yml\uFF09
common.att.storage-path=${CS_ATT_STORAGE_PATH:D:/files/common/}

# \u9644\u4EF6\u4E0A\u4F20\u5927\u5C0F\u9650\u5236
spring.servlet.multipart.max-file-size=${CS_ATT_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${CS_ATT_MAX_REQUEST_SIZE:50MB}

# \u63A5\u53E3\u6587\u6863\uFF1AOpenAPI 3\uFF08/v3/api-docs\uFF09+ Swagger UI\uFF08/swagger-ui.html\uFF09
# \u7EDF\u4E00\u5F00\u5173\u4E3A\u73AF\u5883\u53D8\u91CF CS_API_DOCS_ENABLED\uFF08\u9ED8\u8BA4\u5F00\u542F\uFF09\uFF0C\u751F\u4EA7\u90E8\u7F72\u53EF\u6309\u9700\u5173\u95ED\uFF1B
# \u8BE5\u5F00\u5173\u4EC5\u63A7\u5236\u6587\u6863\u7AEF\u70B9\uFF0C\u5C5E\u90E8\u7F72\u8FD0\u884C\u53C2\u6570\u800C\u975E\u4E1A\u52A1\u914D\u7F6E\uFF0C\u6545\u4E0D\u5165 common_setting\u3002
springdoc.api-docs.enabled=${CS_API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${CS_API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.common.system
springdoc.paths-to-match=/backend/**
# \u516C\u5171\u63A5\u53E3\u524D\u7F00
project.request.prefix=/backend

# \u7b2c\u4e09\u65b9\u8d26\u53f7\u7ed1\u5b9a OAuth \u51ed\u8bc1\u73af\u5883\u53d8\u91cf\u6865\u63a5\uff08CS_* \u4f18\u5148\uff0cfallback SETTING.openid.*\uff0c\u6700\u7ec8\u515c\u5e95\u7a7a\u4e32\uff09\u3002
# sys/org/application.yml \u7684 SETTING.openid \u6bb5\u7ecf CommonSettingService \u540c\u6b65\u5165 common_setting\uff08field_type=openid\uff09\uff0c
# \u8fd0\u884c\u65f6\u8bfb\u53d6\u987a\u5e8f\uff1a\u300c\u6865\u63a5\u952e\u975e\u7a7a\u4f18\u5148 \u2192 common_setting \u8868\u503c\uff08getValue("openid", key)\uff09\u300d\uff0c\u7531 SysOrgProfileService\uff08PF3-BE-002\uff09\u6d88\u8d39\u3002
# \u603b\u5f00\u5173 openid_bind_enable \u8d70 common_setting \u8fd0\u884c\u65f6\u53ef\u5207\uff0c\u4e0d\u7ecf\u73af\u5883\u53d8\u91cf\u3002
# \u6ce8\u610f\uff1asys/org/application.yml \u4e0d\u5728 spring.config.import \u94fe\u4e2d\uff0c${SETTING.openid.*:} \u5360\u4f4d\u7b26\u89e3\u6790\u4e0d\u5230\u65f6\u53d6\u7a7a\u9ed8\u8ba4\u503c\uff0c\u4e0d\u62a5\u9519
# \uff08\u8bbe\u8ba1\u5185\uff1ayml \u9ed8\u8ba4\u503c\u7ecf syncFromYml \u8868\u94fe\u8def\u751f\u6548\uff0c\u73af\u5883\u53d8\u91cf\u7ecf\u6865\u63a5\u952e\u751f\u6548\uff09\u3002
common.org.openid.wechat-app-id=${CS_ORG_WECHAT_APP_ID:${SETTING.openid.wechat_app_id:}}
common.org.openid.wechat-app-secret=${CS_ORG_WECHAT_APP_SECRET:${SETTING.openid.wechat_app_secret:}}
common.org.openid.qq-app-id=${CS_ORG_QQ_APP_ID:${SETTING.openid.qq_app_id:}}
common.org.openid.qq-app-secret=${CS_ORG_QQ_APP_SECRET:${SETTING.openid.qq_app_secret:}}
common.org.openid.redirect-base=${CS_ORG_OAUTH_REDIRECT_BASE:${SETTING.openid.redirect_base:}}